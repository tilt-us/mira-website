name: CI + Container Release

on:
  push:
    branches:
      - development
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.0'

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests and collect coverage
        run: pnpm run test:ci

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/mira-website/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: true
          verbose: true

  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.17.0'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.5.0'

      - uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  kustomize:
    name: Kustomize Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned kubectl with Kustomize
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize deploy/k8s/overlays/dev
          kubectl kustomize deploy/k8s/overlays/staging
          kubectl kustomize deploy/k8s/overlays/prod

  container-smoke:
    name: Container Build Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, playwright, kustomize]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master'))
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build container without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: mira-website:pr-${{ github.sha }}

      - name: Smoke test container
        run: |
          image="mira-website:pr-${GITHUB_SHA}"
          docker run --detach --rm --name mira-website-smoke -p 8080:8080 "$image"
          trap 'docker logs mira-website-smoke; docker stop mira-website-smoke' EXIT
          for _ in $(seq 1 20); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/
          curl --fail --silent --show-error http://127.0.0.1:8080/privacy-policy
          curl --fail --silent --show-error http://127.0.0.1:8080/favicon.ico
          runtime_config="$(curl --fail --silent --show-error http://127.0.0.1:8080/config/runtime.json)"
          printf '%s' "$runtime_config" | jq -e '
            type == "object" and
            .environment == "local" and
            .apiBaseUrl == "http://localhost:8080" and
            .keycloakBaseUrl == "http://localhost:8081"
          ' >/dev/null
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "1000:1000"

  publish-image:
    name: Publish Branch Image
    runs-on: ubuntu-latest
    needs: [unit-tests, playwright, container-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tilt-us/mira-website:sha-${{ github.sha }}
            ghcr.io/tilt-us/mira-website:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/tilt-us/mira-website
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.description=Mira website frontend
            org.opencontainers.image.licenses=NOASSERTION
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Publish image digest summary
        run: |
          {
            echo "## Published image"
            echo "\`ghcr.io/tilt-us/mira-website:sha-${GITHUB_SHA}\`"
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-release:
    name: Promote Existing Release Image
    runs-on: ubuntu-latest
    needs: [unit-tests, playwright]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.promote.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote SHA image to release tags
        id: promote
        env:
          IMAGE: ghcr.io/tilt-us/mira-website
        run: |
          set -euo pipefail
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vX.Y.Z format; got $GITHUB_REF_NAME."
            exit 1
          fi

          source_image="${IMAGE}:sha-${GITHUB_SHA}"
          if ! docker buildx imagetools inspect "$source_image" >/dev/null; then
            echo "::error::The required SHA image $source_image does not exist. Push this commit to development or master before creating the release tag."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          major="${version%%.*}"
          remaining_version="${version#*.}"
          minor="${remaining_version%%.*}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${IMAGE}:${version}" \
            --tag "${IMAGE}:${major}.${minor}" \
            --tag "${IMAGE}:${major}" \
            "$source_image"
          digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish release digest summary
        run: |
          {
            echo "## Promoted release image"
            echo "\`ghcr.io/tilt-us/mira-website:${GITHUB_REF_NAME}\`"
            echo "Digest: \`${{ steps.promote.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
