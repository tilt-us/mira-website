apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tilt-dev
resources:
  - ../../base
  - ingress.yaml
configMapGenerator:
  - name: mira-website-runtime
    files:
      - runtime.json
images:
  # Bootstrap tag only. GitOps should replace this with an immutable digest after the first promotion.
  - name: ghcr.io/tilt-us/mira-website
    newName: ghcr.io/tilt-us/mira-website
    newTag: development
