apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tilt-dev
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - runtime-config.yaml
images:
  # Bootstrap tag only. GitOps should replace this with an immutable digest after the first promotion.
  - name: ghcr.io/tilt-us/mira-website
    newName: ghcr.io/tilt-us/mira-website
    newTag: development
