apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tilt-staging
resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - runtime-config.yaml
images:
  # master is the observed bootstrap tag. Argo CD Image Updater replaces it in-cluster with an immutable digest.
  - name: ghcr.io/tilt-us/mira-website
    newName: ghcr.io/tilt-us/mira-website
    newTag: master
