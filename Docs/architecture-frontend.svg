<svg width="100%" viewBox="0 0 680 460" role="img" xmlns="http://www.w3.org/2000/svg">
    <title>mira-website — Hexagonale Architektur (Angular Frontend)</title>
    <desc>Drei konzentrische Hexagone: Domain Kern, Service Ring, Adapter Ring. Links Components
        Inbound Adapter (getrieben von Browser und Angular Router), rechts API-Client Outbound
        Adapter zum mira-service Backend. Unten Bootstrap-Wiring und Platform Build-Tooling.
    </desc>
    <style>
        .hd{fill:#EEEDFE;stroke:#7F77DD;stroke-width:1.5}
        .hs{fill:none;stroke:#1D9E75;stroke-width:1;stroke-dasharray:5 3;opacity:.8}
        .ha{fill:none;stroke:#534AB7;stroke-width:1;stroke-dasharray:5 3;opacity:.7}
        @media(prefers-color-scheme:dark){
        .hd{fill:#26215C;stroke:#AFA9EC}
        .hs{stroke:#5DCAA5}
        .ha{stroke:#AFA9EC}
        }
    </style>
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
            <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
    </defs>

    <!-- Drei konzentrische Hexagone (pointy-top, Zentrum 340,205) -->
    <!-- Adapter Ring r=153 -->
    <polygon class="ha" points="340,52 472,129 472,281 340,358 208,281 208,129"/>
    <!-- Service Ring r=120 -->
    <polygon class="hs" points="340,85 444,145 444,265 340,325 236,265 236,145"/>
    <!-- Domain Kern r=82 -->
    <polygon class="hd" points="340,123 411,164 411,246 340,287 269,246 269,164"/>

    <!-- Ring-Beschriftungen -->
    <text font-family="sans-serif" font-size="12" x="340" y="36" text-anchor="middle"
          fill="#5F5E5A">Adapter layer
    </text>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="68"
          text-anchor="middle" fill="#085041">Service
    </text>
    <text font-family="sans-serif" font-size="12" x="340" y="82" text-anchor="middle"
          fill="#0F6E56">Use cases
    </text>

    <!-- Domain Kern Inhalt -->
    <text font-family="sans-serif" font-size="14" font-weight="500" x="340" y="193"
          text-anchor="middle" fill="#3C3489">Domain
    </text>
    <text font-family="sans-serif" font-size="12" x="340" y="211" text-anchor="middle"
          fill="#534AB7">Models &amp; Ports
    </text>
    <text font-family="sans-serif" font-size="12" x="340" y="226" text-anchor="middle"
          fill="#534AB7">Value Objects
    </text>

    <!-- Port-Verbindungslinien -->
    <line x1="160" y1="205" x2="206" y2="205" stroke="#888780" stroke-width="1.5"
          marker-end="url(#arrow)"/>
    <line x1="474" y1="205" x2="518" y2="205" stroke="#888780" stroke-width="1.5"
          marker-end="url(#arrow)"/>
    <text font-family="sans-serif" font-size="12" x="183" y="197" text-anchor="middle"
          fill="#888780">«Port»
    </text>
    <text font-family="sans-serif" font-size="12" x="495" y="197" text-anchor="middle"
          fill="#888780">«Port»
    </text>

    <!-- :browser -->
    <rect x="32" y="28" width="118" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="91" y="50"
          text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Browser
    </text>
    <text font-family="sans-serif" font-size="12" x="91" y="68" text-anchor="middle"
          dominant-baseline="central" fill="#5F5E5A">User &amp; DOM events
    </text>

    <!-- :components -->
    <rect x="22" y="155" width="138" height="100" rx="8" fill="#FAECE7" stroke="#993C1D"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="91" y="182"
          text-anchor="middle" dominant-baseline="central" fill="#712B13">Components
    </text>
    <text font-family="sans-serif" font-size="12" x="91" y="200" text-anchor="middle"
          dominant-baseline="central" fill="#993C1D">Standalone UI
    </text>
    <text font-family="sans-serif" font-size="12" x="91" y="216" text-anchor="middle"
          dominant-baseline="central" fill="#993C1D">Templates &amp; Forms
    </text>
    <text font-family="sans-serif" font-size="12" x="91" y="232" text-anchor="middle"
          dominant-baseline="central" fill="#993C1D">Guards
    </text>

    <!-- Router -->
    <rect x="32" y="320" width="118" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="91" y="342"
          text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Router
    </text>
    <text font-family="sans-serif" font-size="12" x="91" y="360" text-anchor="middle"
          dominant-baseline="central" fill="#5F5E5A">Routes &amp; Guards
    </text>

    <!-- Pfeile Inbound-Treiber → Components -->
    <line x1="91" y1="80" x2="91" y2="153" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"
          marker-end="url(#arrow)"/>
    <text font-family="sans-serif" font-size="12" x="104" y="117" fill="#888780">User event</text>
    <line x1="91" y1="320" x2="91" y2="257" stroke="#888780" stroke-width="1" stroke-dasharray="4 3"
          marker-end="url(#arrow)"/>
    <text font-family="sans-serif" font-size="12" x="104" y="293" fill="#888780">Navigation</text>

    <!-- mira-service -->
    <rect x="526" y="28" width="114" height="52" rx="8" fill="#F1EFE8" stroke="#5F5E5A"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="583" y="50"
          text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">mira-service
    </text>
    <text font-family="sans-serif" font-size="12" x="583" y="68" text-anchor="middle"
          dominant-baseline="central" fill="#5F5E5A">Backend REST
    </text>

    <!-- :api-client -->
    <rect x="518" y="155" width="122" height="100" rx="8" fill="#E1F5EE" stroke="#0F6E56"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="579" y="182"
          text-anchor="middle" dominant-baseline="central" fill="#085041">API Client
    </text>
    <text font-family="sans-serif" font-size="12" x="579" y="200" text-anchor="middle"
          dominant-baseline="central" fill="#0F6E56">Generated SDK
    </text>
    <text font-family="sans-serif" font-size="12" x="579" y="216" text-anchor="middle"
          dominant-baseline="central" fill="#0F6E56">HTTP Interceptors
    </text>
    <text font-family="sans-serif" font-size="12" x="579" y="232" text-anchor="middle"
          dominant-baseline="central" fill="#0F6E56">OIDC Access Token
    </text>

    <!-- Pfeil API Client → mira-service -->
    <line x1="579" y1="155" x2="579" y2="82" stroke="#888780" stroke-width="1"
          stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text font-family="sans-serif" font-size="12" x="592" y="120" fill="#888780">HTTPS</text>

    <!-- :application -->
    <rect x="172" y="390" width="148" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="246" y="408"
          text-anchor="middle" dominant-baseline="central" fill="#633806">Bootstrap
    </text>
    <text font-family="sans-serif" font-size="12" x="246" y="424" text-anchor="middle"
          dominant-baseline="central" fill="#854F0B">main.ts · app.config · DI
    </text>

    <!-- :platform -->
    <rect x="360" y="390" width="148" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"
          stroke-width="0.5"/>
    <text font-family="sans-serif" font-size="14" font-weight="500" x="434" y="408"
          text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Platform
    </text>
    <text font-family="sans-serif" font-size="12" x="434" y="424" text-anchor="middle"
          dominant-baseline="central" fill="#5F5E5A">Angular CLI · Vite · pnpm
    </text>

    <!-- L-Pfade application + platform → Hexagon-Bottom -->
    <path d="M 246 390 L 246 374 L 340 374 L 340 360" fill="none" stroke="#B4B2A9"
          stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <path d="M 434 390 L 434 374 L 340 374 L 340 360" fill="none" stroke="#B4B2A9"
          stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

</svg>
