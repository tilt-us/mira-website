<header class="bg-black">
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-6 py-4"
  >
    <div class="flex flex-wrap items-center gap-x-6 gap-y-2">
      <a routerLink="/" class="text-xl font-bold tracking-tight">Mira</a>

      <nav class="flex flex-wrap items-center gap-1" data-testid="primary-nav">
        @for (tab of tabs; track tab.path) {
          <a
            [routerLink]="tab.path"
            routerLinkActive="bg-white/10 !text-white"
            class="rounded-md px-3 py-2 text-sm font-medium text-white/70 transition-colors hover:bg-white/5 hover:text-white"
          >
            {{ tab.label }}
          </a>
        }
      </nav>
    </div>

    <div class="relative">
      @if (auth.isLoggedIn(); as loggedIn) {
        <button
          type="button"
          class="btn-ghost text-sm"
          data-testid="user-menu-button"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          {{ auth.user()?.displayName }}
        </button>

        @if (menuOpen()) {
          <!-- Click-away layer that dismisses the popover. -->
          <button
            type="button"
            class="fixed inset-0 z-30 cursor-default"
            aria-hidden="true"
            tabindex="-1"
            data-testid="menu-backdrop"
            (click)="closeMenu()"
          ></button>

          <div
            class="absolute right-0 z-40 mt-2 w-56 rounded-lg border border-surface-border bg-surface p-3 shadow-2xl"
            role="menu"
            data-testid="user-menu"
          >
            <p class="px-1 text-sm font-medium">{{ auth.user()?.displayName }}</p>
            <p class="truncate px-1 text-xs text-white/50">
              {{ auth.user()?.email }}
            </p>

            <a
              routerLink="/settings"
              class="btn-ghost mt-3 w-full justify-start text-sm"
              role="menuitem"
              data-testid="settings-link"
              (click)="closeMenu()"
            >
              User settings
            </a>

            <button
              type="button"
              class="link mt-2 px-1 text-sm"
              data-testid="logout-button"
              (click)="logout()"
            >
              Log out
            </button>
          </div>
        }
      } @else {
        <button
          type="button"
          class="btn-primary text-sm"
          data-testid="login-button"
          (click)="auth.login()"
        >
          Login
        </button>
      }
    </div>
  </div>
</header>
