<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-colors duration-300"
  [style.--header-overlay-bg]="scrolled() ? 'rgba(0, 0, 0, 0.8)' : 'transparent'"
  [style.border-bottom-color]="scrolled() ? 'var(--app-accent)' : 'transparent'"
  [class]="
    scrolled()
      ? 'border-white/10 bg-black/80 shadow-lg backdrop-blur-md'
      : 'border-transparent bg-transparent'
  "
  data-testid="site-header"
>
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-6 py-3 2xl:max-w-[110rem]"
  >
    <div class="flex flex-wrap items-center gap-x-8 gap-y-2">
      <a routerLink="/" class="text-lg font-bold uppercase tracking-[0.3em]">Mira</a>

      <nav class="flex flex-wrap items-center gap-x-6 gap-y-1" data-testid="primary-nav">
        @for (tab of tabs; track tab.path) {
          <a
            [routerLink]="tab.path"
            routerLinkActive="!text-brand"
            class="py-2 text-xs font-semibold uppercase tracking-widest text-white/60 transition-colors hover:text-white"
          >
            {{ tab.label }}
          </a>
        }
      </nav>
    </div>

    <div class="user-menu-root relative" [class.user-menu-open]="menuOpen()">
      @if (auth.isLoggedIn()) {
        <button
          type="button"
          class="user-menu-trigger btn-ghost h-auto min-h-0 px-3 py-2 text-sm"
          data-testid="user-menu-button"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          <span
            class="avatar-hexagon"
            [class.avatar-hexagon-empty]="!canShowAvatarImage()"
            [attr.aria-label]="(auth.user()?.displayName ?? auth.user()?.preferredUsername ?? 'Profil') + ' Avatar'"
          >
            <svg
              class="avatar-hexagon-rings avatar-hexagon-rings-active"
              aria-hidden="true"
              viewBox="0 0 72 72"
            >
              <g class="avatar-hexagon-ring-middle">
                <polygon points="36 6 62 21 62 51 36 66 10 51 10 21" />
              </g>
              <g class="avatar-hexagon-ring-outer">
                <polygon points="36 2 66 19 66 53 36 70 6 53 6 19" />
              </g>
            </svg>
            <span class="avatar-hexagon-core">
            @if (canShowAvatarImage()) {
            <img
              class="avatar-hexagon-image"
              [src]="auth.user()?.avatarUrl"
              alt=""
              (error)="onAvatarError()"
            />
            } @else {
            <span class="avatar-hexagon-label">
              {{ avatarLabel }}
            </span>
            }
            </span>
          </span>

          <span class="flex flex-col gap-0.5 leading-tight text-left">
            <span class="truncate text-sm font-semibold">{{ auth.user()?.displayName }}</span>
            <span class="truncate text-xs text-white/60">{{ auth.user()?.email }}</span>
          </span>
        </button>

        @if (menuOpen()) {
          <!-- Click-away layer that dismisses the popover. -->
          <button
            type="button"
            class="fixed inset-0 z-[55] cursor-default"
            aria-hidden="true"
            tabindex="-1"
            data-testid="menu-backdrop"
            (click)="closeOverlays()"
          ></button>

          <div
            class="user-menu-card absolute right-0 z-[60] mt-2 rounded-lg border border-surface-border p-3"
            role="menu"
            data-testid="user-menu"
          >
            <p class="px-1 text-sm font-medium">{{ auth.user()?.displayName }}</p>
            <p class="truncate px-1 text-xs text-white/50">
              {{ auth.user()?.email }}
            </p>

            <a
              routerLink="/settings"
              class="user-menu-action mt-3 w-full justify-start text-sm"
              role="menuitem"
              data-testid="settings-link"
              (click)="closeOverlays()"
            >
              User settings
            </a>

            <button
              type="button"
              class="user-menu-action mt-2 w-full justify-start text-sm"
              data-testid="logout-button"
              (click)="logout()"
            >
              Log out
            </button>
          </div>
        }
      } @else {
        <button
          type="button"
          class="btn-primary min-h-0 px-5 py-2 text-sm"
          data-testid="login-button"
          (click)="openAuth()"
        >
          Login
        </button>

        @if (authPopupOpen()) {
          <button
            type="button"
            class="fixed inset-0 z-30 cursor-default bg-black/45"
            aria-hidden="true"
            tabindex="-1"
            data-testid="auth-backdrop"
            (click)="closeOverlays()"
          ></button>

          <div
            class="absolute right-0 z-40 mt-2 w-[20rem]"
            data-testid="auth-popup"
          >
            <app-auth-page
              [compact]="true"
              (closed)="onAuthPopupClosed()"
            ></app-auth-page>
          </div>
        }
      }
    </div>
  </div>
</header>
