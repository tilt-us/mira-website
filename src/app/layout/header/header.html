<header
  class="fixed inset-x-0 top-0 z-50 border-b transition-colors duration-300"
  [class]="
    scrolled()
      ? 'border-white/10 bg-black/80 shadow-lg backdrop-blur-md'
      : 'border-transparent bg-transparent'
  "
  data-testid="site-header"
>
  <div
    class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-6 py-3 2xl:max-w-[110rem]"
  >
    <div class="flex flex-wrap items-center gap-x-8 gap-y-2">
      <a routerLink="/" class="text-lg font-bold uppercase tracking-[0.3em]">Mira</a>

      <nav class="flex flex-wrap items-center gap-x-6 gap-y-1" data-testid="primary-nav">
        @for (tab of tabs; track tab.path) {
          <a
            [routerLink]="tab.path"
            routerLinkActive="!text-brand"
            class="py-2 text-xs font-semibold uppercase tracking-widest text-white/60 transition-colors hover:text-white"
          >
            {{ tab.label }}
          </a>
        }
      </nav>
    </div>

    <div class="relative">
      @if (auth.isLoggedIn(); as loggedIn) {
        <button
          type="button"
          class="btn-ghost min-h-0 px-4 py-2 text-sm"
          data-testid="user-menu-button"
          [attr.aria-expanded]="menuOpen()"
          (click)="toggleMenu()"
        >
          {{ auth.user()?.displayName }}
        </button>

        @if (menuOpen()) {
          <!-- Click-away layer that dismisses the popover. -->
          <button
            type="button"
            class="fixed inset-0 z-30 cursor-default"
            aria-hidden="true"
            tabindex="-1"
            data-testid="menu-backdrop"
            (click)="closeMenu()"
          ></button>

          <div
            class="absolute right-0 z-40 mt-2 w-56 rounded-lg border border-surface-border bg-surface p-3 shadow-2xl"
            role="menu"
            data-testid="user-menu"
          >
            <p class="px-1 text-sm font-medium">{{ auth.user()?.displayName }}</p>
            <p class="truncate px-1 text-xs text-white/50">
              {{ auth.user()?.email }}
            </p>

            <a
              routerLink="/settings"
              class="btn-ghost mt-3 w-full justify-start text-sm"
              role="menuitem"
              data-testid="settings-link"
              (click)="closeMenu()"
            >
              User settings
            </a>

            <button
              type="button"
              class="link mt-2 px-1 text-sm"
              data-testid="logout-button"
              (click)="logout()"
            >
              Log out
            </button>
          </div>
        }
      } @else {
        <button
          type="button"
          class="btn-primary min-h-0 px-5 py-2 text-sm"
          data-testid="login-button"
          (click)="auth.login()"
        >
          Login
        </button>
      }
    </div>
  </div>
</header>
