<div class="flex flex-col items-center gap-3">
  <button
    type="button"
    class="btn-primary text-lg"
    data-testid="primary-download"
    (click)="onPrimaryClick()"
  >
    {{ primaryLabel() }}
  </button>

  <button type="button" class="link text-sm" data-testid="other-systems" (click)="openModal()">
    Other systems (Linux &amp; macOS)
  </button>

  @if (downloadError(); as error) {
    <p class="text-center text-sm text-red-300" role="alert" data-testid="download-error">
      {{ error }}
    </p>
  }
</div>

@if (modalOpen()) {
  <app-os-modal [options]="modalOptions()" (close)="closeModal()" />
}
