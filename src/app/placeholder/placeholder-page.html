@if (content(); as c) {
  <section
    class="mx-auto flex min-h-[60vh] max-w-3xl flex-col items-center justify-center gap-4 px-6 py-24 text-center"
    data-testid="placeholder"
  >
    <h1 class="text-4xl font-bold tracking-tight sm:text-5xl">{{ c.title }}</h1>
    <p class="text-lg text-white/70">{{ c.tagline }}</p>
    <p class="text-sm text-white/40">Coming soon.</p>
  </section>
}
