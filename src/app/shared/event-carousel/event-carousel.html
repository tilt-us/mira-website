<div
  class="event-carousel"
  role="region"
  aria-roledescription="carousel"
  [attr.aria-label]="label()"
  tabindex="0"
  data-testid="event-carousel"
  (keydown.arrowleft)="previous()"
  (keydown.arrowright)="next()"
  (pointerdown)="onPointerDown($event)"
  (pointerup)="onPointerUp($event)"
>
  <div class="event-carousel-frame">
    <div class="event-carousel-viewport">
      <ul class="event-carousel-stage">
        @for (card of items(); track card.id; let i = $index) {
          <li
            class="event-carousel-card"
            [style.--card-offset]="offsetFor(i)"
            [class.is-active]="i === activeIndex()"
            [class.is-far]="isFar(i)"
            [class.is-wrapping]="isWrapping(card.id)"
            role="group"
            aria-roledescription="slide"
            [attr.aria-label]="i + 1 + ' of ' + items().length"
            [attr.aria-hidden]="isFar(i) ? 'true' : null"
            (click)="onCardClick(i)"
          >
            <article
              class="flex h-full flex-col justify-center overflow-hidden rounded-lg border border-surface-border bg-surface/60 p-8 backdrop-blur"
            >
              <h3 class="text-xl font-semibold">{{ card.title }}</h3>
              <p class="mt-3 text-base text-white/70">{{ card.body }}</p>
            </article>
          </li>
        }
      </ul>
    </div>

    <button
      type="button"
      class="event-carousel-nav event-carousel-nav-prev"
      aria-label="Show previous event"
      (click)="previous()"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <button
      type="button"
      class="event-carousel-nav event-carousel-nav-next"
      aria-label="Show next event"
      (click)="next()"
    >
      <svg
        viewBox="0 0 24 24"
        class="h-5 w-5"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  </div>

  <div class="mt-4 flex justify-center gap-2">
    @for (card of items(); track card.id; let i = $index) {
      <button
        type="button"
        class="event-carousel-dot"
        [class.is-active]="i === activeIndex()"
        [attr.aria-label]="'Go to event ' + (i + 1)"
        [attr.aria-current]="i === activeIndex() ? 'true' : null"
        (click)="select(i)"
      ></button>
    }
  </div>
</div>
